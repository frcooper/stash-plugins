name: Reencode
description: Adds a Reencode button to the scene edit panel. It re-encodes the scene's file with ffmpeg and swaps the new file in as the scene's file, then deletes the original or moves it to a backup folder.
version: 0.3.0
url: https://github.com/frcooper/stash-plugins/tree/main/plugins/Reencode
exec:
  - python
  - "{pluginDir}/reencode.py"
interface: raw
ui:
  javascript:
    - Reencode.js
  css:
    - Reencode.css
settings:
  videoCodec:
    displayName: Video encoder
    description: Any ffmpeg encoder, e.g. libsvtav1, libx265, hevc_nvenc, av1_qsv, or copy. Blank uses libsvtav1 (AV1), or libx265 (HEVC) if your ffmpeg doesn't have it.
    type: STRING
  videoArgs:
    displayName: Video encoder options
    description: "Blank uses defaults for the encoder, e.g. libsvtav1: -crf 30 -preset 6 -pix_fmt yuv420p10le."
    type: STRING
  audioCodec:
    displayName: Audio encoder
    description: Any ffmpeg encoder, or copy. Blank copies the audio when browsers can play it (AAC, MP3, Opus) and encodes AAC otherwise.
    type: STRING
  audioArgs:
    displayName: Audio encoder options
    description: Blank uses -b:a 192k when encoding.
    type: STRING
  container:
    displayName: Container
    description: Extension of the new file, e.g. mp4, mkv, webm. Blank uses mp4.
    type: STRING
  inputArgs:
    displayName: Input options
    description: Placed before -i, e.g. -hwaccel cuda.
    type: STRING
  extraArgs:
    displayName: Extra output options
    description: Added after the codec options, e.g. -vf scale=-2:1080.
    type: STRING
  outputArgs:
    displayName: Replace all output options
    description: If set, this exact ffmpeg output argument list is used instead of the generated one, and the encoder, options and extra options above are ignored. Output format, progress and file name are still added.
    type: STRING
  ffmpegPath:
    displayName: ffmpeg path
    description: Blank uses the ffmpeg Stash is configured with.
    type: STRING
  backupOriginals:
    displayName: Back up originals
    description: Move the original file to the backup folder instead of deleting it.
    type: BOOLEAN
  backupFolder:
    displayName: Backup folder
    description: Where originals go when backing up, as a path on the Stash machine. Created if needed.
    type: STRING
  skipGenerate:
    displayName: Don't generate for the new file
    description: Skip queueing sprite, preview, marker and phash generation for the scene after the swap.
    type: BOOLEAN
